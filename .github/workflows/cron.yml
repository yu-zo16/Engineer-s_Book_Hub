name: Scheduled Tech Book Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: "scripts"
        run: |
          python -m pip install --upgrade pip
          pip install supabase pandas requests amazon-paapi


      - name: Run Pipeline
        working-directory: "scripts"
        run: |
          python qiita_all_search.py
          python asin_search.py
          python creat_link.py
          python ranking_create.py