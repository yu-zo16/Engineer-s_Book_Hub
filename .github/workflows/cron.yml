name: Scheduled Tech Book Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # リポジトリ取得
      - name: Checkout code
        uses: actions/checkout@v4

      # Python環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # pip更新
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 依存関係インストール（分割＝原因特定しやすい）
      - name: Install supabase
        run: python -m pip install supabase

      - name: Install pandas
        run: python -m pip install pandas

      - name: Install requests
        run: python -m pip install requests

      - name: Install Amazon PAAPI
        run: python -m pip install amazon-paapi5

      # インストール確認（超重要デバッグ）
      - name: Check installed packages
        run: python -m pip list

      # importテスト（ここで落ちたら原因即特定できる）
      - name: Test import
        run: python -c "from amazon_paapi import AmazonApi; print('IMPORT SUCCESS')"

      # スクリプト実行
      - name: Run Pipeline
        working-directory: scripts
        run: |
          python qiita_all_search.py
          python asin_search.py
          python creat_link.py
          python ranking_create.py
